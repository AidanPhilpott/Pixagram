[package]
name = "pixagram"
version = "0.1.0"
description = "Non-destructive, Lightroom-style RAW editor for Fujifilm RAF files"
authors = ["Aidan Philpott"]
edition = "2021"
rust-version = "1.77"

# The Tauri app is a thin shell over a library crate. Keeping the logic in the
# library keeps the door open for a future iPad/native frontend to reuse it
# (engineering practice: portable engine + thin UI).
[lib]
name = "pixagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Generate the TypeScript mirror of the shared adjustment types from the Rust
# structs so the hand-written mirror can't drift (constraint #1). `cargo test`
# writes the bindings (see `npm run gen:types`).
ts-rs = "=10.1.0"

# Raw decode + X-Trans (Markesteijn) demosaic. Pinned to match the `image`
# version rawler re-exports so DynamicImage unifies across the two crates.
rawler = "=0.7.2"
image = { version = "0.25", default-features = true }
base64 = "0.22"
anyhow = "1"
log = "0.4"

# Raw decode in a fully unoptimized debug build is painfully slow. Optimize
# dependencies (rawler, image) while keeping our own crate debuggable.
[profile.dev.package."*"]
opt-level = 2
